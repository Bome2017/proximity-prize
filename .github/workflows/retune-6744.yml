name: Validate 67.44 locator candidate

on:
  push:
    branches:
      - codex/6744-locator-retune
    paths:
      - .github/workflows/retune-6744.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: 2
      MATHLIB_NO_CACHE_ON_UPDATE: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false

      - name: Install pinned Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update
          git diff --exit-code -- lake-manifest.json lean-toolchain lakefile.toml
          lake exe cache get || true

      - name: Submission source gates
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/check-submission-imports.sh lower ProximityPrize/SubmissionLower
          git diff --check
          test "$(cat ProximityPrize/SubmissionLower/score.txt)" = "6744"
          test "$(cat ProximityPrize/SubmissionLower/radius.txt)" = "10265855/33554432"
          grep -q 'ProtocolClaim 6744 10265855 33554432' ProximityPrize/SubmissionLower/Solution.lean
          test "$(find ProximityPrize/SubmissionLower -type f -printf '%s\n' | awk '{s+=$1} END {print s}')" -le 4194304

      - name: Build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          lake build ProximityPrize.SubmissionLower.Solution

      - name: Exact theorem and axiom closure
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/check-6744.lean <<'EOF'
          import ProximityPrize.SubmissionLower.Solution
          #check (ProximityPrize.Benchmark.candidate :
            ProximityPrize.Benchmark.ProtocolClaim 6744 10265855 33554432)
          #print axioms ProximityPrize.Benchmark.candidate
          open Lean Lean.Meta
          open Elab Command in
          run_cmd liftTermElabM do
            let allowed : List Name := [``propext, ``Classical.choice, ``Quot.sound]
            let used ← collectAxioms ``ProximityPrize.Benchmark.candidate
            let bad := used.toList.filter (fun ax => !allowed.contains ax)
            unless bad.isEmpty do
              throwError "candidate has forbidden axioms: {bad}"
          EOF
          lake env lean /tmp/check-6744.lean

      - name: Kernel replay of exported module
        shell: bash
        run: |
          set -euo pipefail
          LEAN_NUM_THREADS=1 LEAN_ABORT_ON_PANIC=1 \
            lake env leanchecker ProximityPrize.SubmissionLower.Solution
